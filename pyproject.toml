[project]
name = "flownet2-pytorch"
version = "1.0.0"
description = "PyTorch implementation of FlowNet 2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-image>=0.19.0",
    "tensorboardX>=2.5",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "pillow>=9.0.0",
    "h5py>=3.6.0",
    "protobuf>=3.20.0",
    "tqdm>=4.64.0",
    "colorama>=0.4.0",
    "setproctitle>=1.3.0",
    "imageio[ffmpeg]>=2.28.0",
    "pytz>=2022.0",
    "setuptools>=65.0.0",
]

[build-system]
requires = ["setuptools>=65.0.0"]
build-backend = "setuptools.build_meta"